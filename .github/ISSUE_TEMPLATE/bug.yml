name: Bug report
description: Report a reproducible problem in Yggaro Lite Server
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include secrets, personal data or security vulnerabilities. Report vulnerabilities privately: https://github.com/Yggnet-Labs/yggaro-lite/security/policy."
  - type: input
    id: version
    attributes: {label: Version, description: "Output of yggaro-server -version"}
    validations: {required: true}
  - type: dropdown
    id: install
    attributes: {label: Installation, options: [Published self-host release, Hosted service, Source build, Other]}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: Reproduction steps}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected behaviour}
    validations: {required: true}
  - type: textarea
    id: actual
    attributes: {label: Actual behaviour and redacted logs}
    validations: {required: true}
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, personal data and customer content.
          required: true
        - label: This is not a security vulnerability.
          required: true
